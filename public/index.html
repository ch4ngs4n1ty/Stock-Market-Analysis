<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Research</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0d1117;
      --card:   #161b22;
      --border: #30363d;
      --text:   #e6edf3;
      --muted:  #8b949e;
      --green:  #3fb950;
      --red:    #f85149;
      --yellow: #d29922;
      --blue:   #58a6ff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── Search ────────────────────────────────────────────────────────── */
    .search-wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 20px 12px;
      display: flex;
      gap: 8px;
    }
    .search-wrap input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      letter-spacing: 0.5px;
    }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-wrap input:focus { border-color: var(--blue); }
    .search-wrap button {
      background: var(--blue);
      color: #0d1117;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .search-wrap button:hover { opacity: 0.88; }

    /* ── Layout ────────────────────────────────────────────────────────── */
    #main {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* ── Stock header ──────────────────────────────────────────────────── */
    .stock-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 24px;
      margin-bottom: 20px;
    }
    .sym-name { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
    .price-block { display: flex; align-items: baseline; gap: 10px; }
    .price-val { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .change-val { font-size: 15px; font-weight: 600; }
    .change-val.up   { color: var(--green); }
    .change-val.down { color: var(--red);   }
    .refresh-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .pulse {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }

    /* ── Card ──────────────────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.9px;
      margin-bottom: 14px;
    }

    /* ── Score card ────────────────────────────────────────────────────── */
    .score-layout {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 28px;
      align-items: center;
    }
    @media (max-width: 500px) { .score-layout { grid-template-columns: 1fr; } }

    .gauge-svg { width: 100%; display: block; }

    .sub-scores { display: flex; flex-direction: column; gap: 11px; }
    .sub-row {
      display: grid;
      grid-template-columns: 96px 1fr 40px;
      align-items: center;
      gap: 10px;
    }
    .sub-label { font-size: 13px; color: var(--muted); }
    .bar-track {
      height: 6px;
      background: #21262d;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease, background 0.5s ease;
    }
    .sub-val {
      font-size: 13px;
      font-weight: 600;
      text-align: right;
      font-variant-numeric: tabular-nums;
      transition: color 0.4s;
    }

    /* ── Chart ─────────────────────────────────────────────────────────── */
    .chart-box { position: relative; height: 200px; }

    /* ── 52w range ─────────────────────────────────────────────────────── */
    .range-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .range-track {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      position: relative;
      margin-bottom: 4px;
    }
    .range-fill {
      position: absolute;
      left: 0; top: 0;
      height: 100%;
      background: var(--blue);
      border-radius: 2px;
      transition: width 0.5s ease;
    }
    .range-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 10px; height: 10px;
      background: var(--blue);
      border-radius: 50%;
      transition: left 0.5s ease;
    }
    .range-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }

    /* ── Tile grid ─────────────────────────────────────────────────────── */
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      margin-top: 14px;
    }
    .tile {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 13px;
    }
    .tile-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .tile-value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .c-green   { color: var(--green); }
    .c-red     { color: var(--red);   }
    .c-yellow  { color: var(--yellow);}
    .c-neutral { color: var(--text);  }
    .c-null    { color: var(--muted); }

    /* ── States ────────────────────────────────────────────────────────── */
    #loading, #error-box {
      max-width: 860px;
      margin: 48px auto;
      padding: 0 20px;
      text-align: center;
    }
    #loading  { color: var(--muted); }
    #error-box{ color: var(--red);   }
    [hidden]  { display: none !important; }
  </style>
</head>
<body>

<!-- Search -->
<div class="search-wrap">
  <input id="sym-input" type="text" placeholder="Ticker — e.g. AAPL, NVDA, MSFT"
         autocomplete="off" spellcheck="false" />
  <button id="search-btn">Search</button>
</div>

<div id="loading"   hidden>Loading…</div>
<div id="error-box" hidden></div>

<main id="main" hidden>

  <!-- Header -->
  <div class="stock-header">
    <span id="sym-display"    class="sym-name"></span>
    <div class="price-block">
      <span id="price-display"  class="price-val"></span>
      <span id="change-display" class="change-val"></span>
    </div>
    <div class="refresh-badge">
      <div class="pulse"></div>
      <span id="countdown">refreshing in 30s</span>
    </div>
  </div>

  <!-- Research Score -->
  <div class="card">
    <div class="card-title">Research Score</div>
    <div class="score-layout">
      <!-- Gauge -->
      <svg id="gauge" class="gauge-svg" viewBox="0 0 200 148">
        <path id="g-bg"  fill="none" stroke="#21262d"       stroke-width="11" stroke-linecap="round"/>
        <path id="g-fg"  fill="none" stroke-width="11" stroke-linecap="round"
              style="transition: d 0.5s ease, stroke 0.5s ease"/>
        <text id="g-num"  x="100" y="92" text-anchor="middle" dominant-baseline="middle"
              font-size="34" font-weight="700" fill="#e6edf3"
              style="transition: fill 0.4s"></text>
        <text x="100" y="115" text-anchor="middle"
              font-size="11" fill="#8b949e">/ 100</text>
      </svg>

      <!-- Sub-scores -->
      <div class="sub-scores">
        <div class="sub-row">
          <span class="sub-label">Growth</span>
          <div class="bar-track"><div id="b-growth" class="bar-fill"></div></div>
          <span id="v-growth" class="sub-val"></span>
        </div>
        <div class="sub-row">
          <span class="sub-label">Profitability</span>
          <div class="bar-track"><div id="b-profitability" class="bar-fill"></div></div>
          <span id="v-profitability" class="sub-val"></span>
        </div>
        <div class="sub-row">
          <span class="sub-label">Leverage</span>
          <div class="bar-track"><div id="b-leverage" class="bar-fill"></div></div>
          <span id="v-leverage" class="sub-val"></span>
        </div>
        <div class="sub-row">
          <span class="sub-label">Momentum</span>
          <div class="bar-track"><div id="b-momentum" class="bar-fill"></div></div>
          <span id="v-momentum" class="sub-val"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Live price chart -->
  <div class="card">
    <div class="card-title">
      Live Price &nbsp;<span style="font-weight:400;text-transform:none;font-size:11px;color:var(--muted)">
        — updates every 30s while open
      </span>
    </div>
    <div class="chart-box">
      <canvas id="price-chart"></canvas>
    </div>
  </div>

  <!-- Technicals -->
  <div class="card">
    <div class="card-title">Technicals</div>
    <div class="range-header">
      <span>52-Week Range</span>
      <span id="dist-label"></span>
    </div>
    <div class="range-track">
      <div id="r-fill"  class="range-fill"></div>
      <div id="r-thumb" class="range-thumb"></div>
    </div>
    <div class="range-labels">
      <span id="low52-lbl">—</span>
      <span id="high52-lbl">—</span>
    </div>
    <div class="tile-grid" id="tech-grid"></div>
  </div>

  <!-- Fundamentals -->
  <div class="card">
    <div class="card-title">Fundamentals</div>
    <div class="tile-grid" id="fund-grid"></div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ── Constants ────────────────────────────────────────────────────────────────
const POLL_MS = 30_000;
const CX = 100, CY = 88, R = 63, START_DEG = 135, SWEEP = 270;

// ── State ────────────────────────────────────────────────────────────────────
let chart = null, pollTimer = null, tickTimer = null;

// ── Gauge math ────────────────────────────────────────────────────────────────
function xy(deg) {
  const r = deg * Math.PI / 180;
  return [CX + R * Math.cos(r), CY + R * Math.sin(r)];
}
function arc(startDeg, sweepDeg) {
  if (sweepDeg <= 0) return '';
  sweepDeg = Math.min(sweepDeg, 359.9);
  const [sx, sy] = xy(startDeg);
  const [ex, ey] = xy(startDeg + sweepDeg);
  return `M${sx.toFixed(1)} ${sy.toFixed(1)} A${R} ${R} 0 ${sweepDeg > 180 ? 1 : 0} 1 ${ex.toFixed(1)} ${ey.toFixed(1)}`;
}
function scoreColor(v) {
  return v >= 70 ? '#3fb950' : v >= 40 ? '#d29922' : '#f85149';
}

// ── Chart ────────────────────────────────────────────────────────────────────
function initChart() {
  if (chart) { chart.destroy(); chart = null; }
  const ctx = document.getElementById('price-chart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        data: [], borderColor: '#58a6ff',
        backgroundColor: 'rgba(88,166,255,0.07)',
        borderWidth: 2, pointRadius: 3,
        pointBackgroundColor: '#58a6ff',
        tension: 0.35, fill: true,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 350 },
      scales: {
        x: { grid: { color: '#21262d' }, ticks: { color: '#8b949e', font: { size: 11 } } },
        y: {
          position: 'right',
          grid: { color: '#21262d' },
          ticks: { color: '#8b949e', font: { size: 11 }, callback: v => '$' + v.toFixed(2) },
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => ' $' + c.parsed.y.toFixed(2) } }
      }
    }
  });
}

function pushPrice(price) {
  if (!chart || price == null) return;
  const t = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  chart.data.labels.push(t);
  chart.data.datasets[0].data.push(price);
  if (chart.data.labels.length > 80) {
    chart.data.labels.shift();
    chart.data.datasets[0].data.shift();
  }
  const pts = chart.data.datasets[0].data;
  const up  = pts.length < 2 || pts[pts.length - 1] >= pts[0];
  const col = up ? '#3fb950' : '#f85149';
  chart.data.datasets[0].borderColor      = col;
  chart.data.datasets[0].backgroundColor  = col.replace('#', 'rgba(') // fallback
    .replace('3fb950', '63,185,80,0.07)').replace('f85149', '248,81,73,0.07)');
  chart.update();
}

// ── Formatting ────────────────────────────────────────────────────────────────
const f2 = v => v != null ? v.toFixed(2) : null;
const pct = v => v != null ? (v >= 0 ? '+' : '') + v.toFixed(2) + '%' : null;
const big = v => {
  if (v == null) return null;
  const a = Math.abs(v);
  if (a >= 1e12) return (v/1e12).toFixed(2) + 'T';
  if (a >= 1e9)  return (v/1e9).toFixed(2)  + 'B';
  if (a >= 1e6)  return (v/1e6).toFixed(2)  + 'M';
  return v.toFixed(0);
};

function tile(label, val, cls = 'c-neutral') {
  return `<div class="tile">
    <div class="tile-label">${label}</div>
    <div class="tile-value ${val == null ? 'c-null' : cls}">${val ?? '—'}</div>
  </div>`;
}

// ── UI update ─────────────────────────────────────────────────────────────────
function updateUI(d) {
  // Header
  document.getElementById('sym-display').textContent = d.symbol;
  document.getElementById('price-display').textContent =
    d.price != null ? '$' + d.price.toFixed(2) : '—';
  const chEl = document.getElementById('change-display');
  if (d.changePct != null) {
    chEl.textContent = (d.changePct >= 0 ? '+' : '') + d.changePct.toFixed(2) + '%';
    chEl.className = 'change-val ' + (d.changePct >= 0 ? 'up' : 'down');
  }

  // Live chart
  pushPrice(d.price);

  // Score gauge
  document.getElementById('g-bg').setAttribute('d', arc(START_DEG, SWEEP));
  const filled = (d.score.composite / 100) * SWEEP;
  document.getElementById('g-fg').setAttribute('d', arc(START_DEG, filled));
  document.getElementById('g-fg').setAttribute('stroke', scoreColor(d.score.composite));
  const gNum = document.getElementById('g-num');
  gNum.textContent = d.score.composite.toFixed(1);
  gNum.setAttribute('fill', scoreColor(d.score.composite));

  // Sub-scores
  for (const key of ['growth', 'profitability', 'leverage', 'momentum']) {
    const v = d.score[key];
    const col = scoreColor(v);
    document.getElementById(`b-${key}`).style.cssText = `width:${v}%;background:${col}`;
    const valEl = document.getElementById(`v-${key}`);
    valEl.textContent = v.toFixed(1);
    valEl.style.color = col;
  }

  // 52w range bar
  const { price, high52w, low52w, distFrom52wHigh } = d;
  if (price != null && high52w != null && low52w != null && high52w > low52w) {
    const p = ((price - low52w) / (high52w - low52w) * 100).toFixed(1);
    document.getElementById('r-fill').style.width  = p + '%';
    document.getElementById('r-thumb').style.left  = p + '%';
  }
  document.getElementById('low52-lbl').textContent  = low52w  ? '$' + low52w.toFixed(2)  : '—';
  document.getElementById('high52-lbl').textContent = high52w ? '$' + high52w.toFixed(2) : '—';
  document.getElementById('dist-label').textContent =
    distFrom52wHigh != null ? distFrom52wHigh.toFixed(2) + '% from 52w high' : '';

  // Technicals tiles
  document.getElementById('tech-grid').innerHTML = [
    tile('Volume',     big(d.volume)),
    tile('Rel Volume', d.relativeVolume != null ? d.relativeVolume.toFixed(2) + '×' : null,
         d.relativeVolume >= 2 ? 'c-green' : d.relativeVolume >= 1 ? 'c-neutral' : 'c-red'),
    tile('50D MA',     d.ma50d  != null ? '$' + d.ma50d.toFixed(2)  : null),
    tile('200D MA',    d.ma200d != null ? '$' + d.ma200d.toFixed(2) : null),
    tile('vs 200D MA',
         price != null && d.ma200d != null ? (price > d.ma200d ? '▲ Above' : '▼ Below') : null,
         price != null && d.ma200d != null ? (price > d.ma200d ? 'c-green' : 'c-red') : 'c-null'),
  ].join('');

  // Fundamentals tiles
  const f = d.fundamentals;
  document.getElementById('fund-grid').innerHTML = [
    tile('Rev Growth',  pct(f.revenueGrowthYoy),
         f.revenueGrowthYoy > 0 ? 'c-green' : 'c-red'),
    tile('EPS Growth',  pct(f.epsGrowthYoy),
         f.epsGrowthYoy > 0 ? 'c-green' : 'c-red'),
    tile('Gross Margin',   f.grossMargin     != null ? f.grossMargin.toFixed(1)     + '%' : null),
    tile('Op Margin',      f.operatingMargin != null ? f.operatingMargin.toFixed(1) + '%' : null),
    tile('Net Margin',     f.netMargin       != null ? f.netMargin.toFixed(1)       + '%' : null),
    tile('ROE',            f.roe != null ? f.roe.toFixed(1) + '%' : null,
         f.roe > 20 ? 'c-green' : f.roe > 0 ? 'c-neutral' : 'c-red'),
    tile('Debt / Equity',  f.debtToEquity != null ? f.debtToEquity.toFixed(2) : null,
         f.debtToEquity < 1 ? 'c-green' : f.debtToEquity < 3 ? 'c-yellow' : 'c-red'),
    tile('Current Ratio',  f.currentRatio != null ? f.currentRatio.toFixed(2) : null,
         f.currentRatio >= 2 ? 'c-green' : f.currentRatio >= 1 ? 'c-yellow' : 'c-red'),
    tile('Free Cash Flow', big(f.freeCashFlow),
         f.freeCashFlow > 0 ? 'c-green' : 'c-red'),
  ].join('');
}

// ── Polling ───────────────────────────────────────────────────────────────────
function stopAll() {
  clearInterval(pollTimer);
  clearInterval(tickTimer);
}

function startPolling(symbol) {
  stopAll();
  let secs = POLL_MS / 1000;
  const cdEl = document.getElementById('countdown');

  tickTimer = setInterval(() => {
    secs--;
    if (secs <= 0) secs = POLL_MS / 1000;
    cdEl.textContent = `refreshing in ${secs}s`;
  }, 1000);

  pollTimer = setInterval(async () => {
    secs = POLL_MS / 1000;
    try {
      updateUI(await api(symbol));
    } catch (e) {
      console.warn('Poll:', e.message);
    }
  }, POLL_MS);
}

// ── Fetch ─────────────────────────────────────────────────────────────────────
async function api(symbol) {
  const res  = await fetch(`/api/v1/stock/${encodeURIComponent(symbol)}`);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || 'Request failed');
  return body;
}

// ── Search ────────────────────────────────────────────────────────────────────
async function search(symbol) {
  if (!symbol) return;
  stopAll();

  const mainEl  = document.getElementById('main');
  const loadEl  = document.getElementById('loading');
  const errEl   = document.getElementById('error-box');

  mainEl.hidden = true;
  errEl.hidden  = true;
  loadEl.hidden = false;

  try {
    const data = await api(symbol);
    loadEl.hidden = true;
    mainEl.hidden = false;
    initChart();
    updateUI(data);
    startPolling(symbol);
  } catch (e) {
    loadEl.hidden = true;
    errEl.hidden  = false;
    errEl.textContent = e.message;
  }
}

// ── Events ────────────────────────────────────────────────────────────────────
document.getElementById('search-btn').addEventListener('click', () =>
  search(document.getElementById('sym-input').value.trim().toUpperCase()));

document.getElementById('sym-input').addEventListener('keydown', e => {
  if (e.key === 'Enter')
    search(document.getElementById('sym-input').value.trim().toUpperCase());
});
</script>
</body>
</html>
